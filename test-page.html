<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page for Web2Figma Automation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        h1 {
            margin-top: 0;
            font-size: 2.5em;
        }
        .button {
            display: inline-block;
            padding: 12px 24px;
            background: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
            font-weight: bold;
        }
        .card {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            margin-top: 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Web2Figma Test Page</h1>
        <p>This is a simple test page for the automated capture pipeline.</p>

        <div class="card">
            <h2>Features:</h2>
            <ul>
                <li>Gradient background</li>
                <li>Card layout with backdrop filter</li>
                <li>Button with hover state</li>
                <li>Typography styling</li>
            </ul>
        </div>

        <a href="#" class="button">Test Button</a>

        <p style="margin-top: 30px; opacity: 0.8; font-size: 0.9em;">
            If you can see this page, the automation is ready to capture it!
        </p>
    </div>
</body>
</html>
